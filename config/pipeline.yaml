version: "1"
project: Project1-PM000003-Parity-Analysis
state_file: state/task-state.json

execution_policy:
  allow_independent_task_start: true
  allow_resume: true
  stop_on_failed_dependency: true
  stop_on_blocked_requirement: true
  never_assume: true

statuses: [NOT_STARTED, READY, RUNNING, SUCCESS, PARTIAL, FAILED, BLOCKED]

tasks:
  - id: requirements-confirm
    name: Confirm Requirements
    agent: Project1 Requirements Analyst
    prerequisites: []
    outputs: [docs/CONFIRMED_REQUIREMENTS.md, config/project1.yaml]

  - id: db-init
    name: Initialize and Validate Database
    agent: Project1 Database Migrator
    prerequisites: [requirements-confirm]
    outputs: [database_schema, schema_validation]

  - id: cpp-load
    name: Load CPP Snapshots
    agent: Project1 CPP Loader
    prerequisites: [requirements-confirm, db-init]
    outputs: [cpp_tables, cpp_load_metadata]

  - id: ims-migrate
    name: Migrate IMS Snapshots
    agent: Project1 IMS Migrator
    prerequisites: [requirements-confirm, db-init]
    outputs: [ims_tables, ims_parity_evidence]

  - id: report-parse
    name: Parse Mismatch Report
    agent: Project1 Report Runner
    prerequisites: [requirements-confirm, db-init]
    outputs: [mismatch_input, daily_review_workbooks]

  - id: cpp-explode
    name: Explode CPP Packets
    agent: Project1 CPP Analyst
    prerequisites: [cpp-load]
    outputs: [cpp_data, packet_explosion_metrics]

  - id: classify
    name: Apply Deterministic KD Rules
    agent: Project1 Classifier
    prerequisites:
      [requirements-confirm, cpp-load, ims-migrate, report-parse, cpp-explode]
    outputs: [mismatch_verdict, enriched_workbooks]

  - id: llm-review
    name: Review Unresolved Candidates
    agent: Project1 LLM Analyst
    prerequisites: [classify]
    outputs: [validated_llm_findings]

  - id: human-review-import
    name: Import Human Review
    agent: Project1 Review Coordinator
    prerequisites: [llm-review]
    outputs: [manual_verdicts, review_feedback]

  - id: final-report
    name: Generate Final Excel Report
    agent: Project1 Reporter
    prerequisites: [human-review-import]
    outputs: [final_review_workbook]

  - id: validate
    name: Validate Outputs
    agent: Project1 Validator
    prerequisites: [final-report]
    outputs: [validation_report]

  - id: consolidate
    name: Consolidate Approved Reports
    agent: Project1 Consolidated Reporter
    prerequisites: [validate]
    optional: true
    outputs: [consolidated_report]
